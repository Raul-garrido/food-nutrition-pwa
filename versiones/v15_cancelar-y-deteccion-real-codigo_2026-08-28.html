<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food &amp; Nutrition AI</title>
<meta name="description" content="Analiza alimentos y síntomas nutricionales con datos reales de USDA y Open Food Facts, explicados por IA. Sin backend, sin cuentas.">
<meta name="theme-color" content="#12312a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0b1210; --bg-elev:#121b18; --bg-card:#16211d; --border:#26352f;
  --text:#eaf3ee; --text-dim:#a9bdb4; --text-faint:#7b9084;
  --accent:#3ea373; --accent-strong:#57c290; --accent-contrast:#04140d;
  --warn:#e0a63e; --warn-bg:#2b2210; --danger:#e05a4e; --danger-bg:#2b1512;
  --ok:#3ea373; --info:#4c9fd6;
  --radius:14px; --radius-sm:8px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  font-size:16px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f8f6; --bg-elev:#ffffff; --bg-card:#ffffff; --border:#dbe6e0;
    --text:#132019; --text-dim:#3f544a; --text-faint:#6b8177;
    --accent:#1f7a53; --accent-strong:#166043; --accent-contrast:#f2fbf6;
    --warn:#9a6b12; --warn-bg:#fbf1da; --danger:#b3382c; --danger-bg:#fbe6e3;
    --ok:#1f7a53; --info:#1f6fa8;
    --shadow:0 8px 24px rgba(20,40,30,.08);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
a{color:var(--accent-strong)}
button{font-family:inherit}
#app{display:flex; flex-direction:column; min-height:100vh}
header.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg-elev);
  border-bottom:1px solid var(--border); padding:.6rem .9rem;
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
}
.brand{display:flex; align-items:center; gap:.5rem; font-weight:700; font-size:1.05rem}
.brand .logo{width:26px; height:26px; flex:none}
.status-pill{
  display:inline-flex; align-items:center; gap:.35rem; font-size:.75rem;
  padding:.25rem .55rem; border-radius:999px; border:1px solid var(--border);
  color:var(--text-dim); white-space:nowrap;
}
.status-pill.online{color:var(--ok); border-color:var(--ok)}
.status-pill.offline{color:var(--warn); border-color:var(--warn)}
.dot{width:.5rem; height:.5rem; border-radius:50%; background:currentColor}
nav.tabs{
  position:sticky; top:48px; z-index:19; background:var(--bg);
  display:flex; gap:.25rem; overflow-x:auto; padding:.4rem .6rem;
  border-bottom:1px solid var(--border);
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:none; background:transparent; border:1px solid transparent; color:var(--text-dim);
  padding:.45rem .75rem; border-radius:999px; font-size:.85rem; cursor:pointer;
  display:flex; align-items:center; gap:.35rem;
}
nav.tabs button.active{background:var(--bg-card); border-color:var(--border); color:var(--text); font-weight:600}
main{flex:1; padding:1rem .9rem 3rem; max-width:820px; width:100%; margin:0 auto}
h1,h2,h3{line-height:1.25}
h1{font-size:1.4rem; margin:.2rem 0 .8rem}
h2{font-size:1.1rem; margin:1.4rem 0 .6rem}
h3{font-size:1rem; margin:.9rem 0 .4rem}
p{line-height:1.5; color:var(--text-dim)}
.card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:1rem; margin-bottom:.8rem; box-shadow:var(--shadow);
}
.card.tight{padding:.7rem .9rem}
.row{display:flex; gap:.6rem; flex-wrap:wrap}
.col{flex:1; min-width:0}
label{display:block; font-size:.8rem; color:var(--text-dim); margin-bottom:.25rem; font-weight:600}
input[type=text],input[type=password],input[type=search],textarea,select{
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  padding:.6rem .7rem; border-radius:var(--radius-sm); font-size:.95rem; outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical; min-height:4.5rem}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--accent); color:var(--accent-contrast); border:none;
  padding:.65rem 1rem; border-radius:var(--radius-sm); font-weight:700; font-size:.9rem;
  cursor:pointer;
}
.btn:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text)}
.btn.danger{background:var(--danger); color:#fff}
.btn.small{padding:.4rem .7rem; font-size:.8rem}
.btn.full{width:100%}
.chip{
  display:inline-flex; align-items:center; gap:.3rem; font-size:.75rem;
  padding:.2rem .55rem; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);
}
.chip.ok{color:var(--ok); border-color:var(--ok)}
.chip.warn{color:var(--warn); border-color:var(--warn)}
.chip.danger{color:var(--danger); border-color:var(--danger)}
.chip.info{color:var(--info); border-color:var(--info)}
.badge-dot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block}
.muted{color:var(--text-faint); font-size:.8rem}
.divider{height:1px; background:var(--border); margin:.8rem 0; border:none}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:.6rem}
@media (max-width:520px){.grid-2{grid-template-columns:1fr}}
.candidate-card{
  display:flex; align-items:center; gap:.7rem; padding:.8rem; border-radius:var(--radius);
  background:var(--bg-card); border:1px solid var(--border); margin-bottom:.6rem; cursor:pointer;
}
.candidate-card:hover{border-color:var(--accent)}
.candidate-rank{font-size:1.4rem; width:2rem; text-align:center; flex:none}
.candidate-body{flex:1; min-width:0}
.candidate-body strong{display:block; font-size:1rem}
.stars{color:var(--warn); letter-spacing:1px}
.warning-banner{
  background:var(--danger-bg); border:1px solid var(--danger); color:var(--text);
  border-radius:var(--radius); padding:.9rem; margin-bottom:.9rem;
}
.warning-banner strong{color:var(--danger)}
.info-banner{
  background:var(--warn-bg); border:1px solid var(--warn); color:var(--text);
  border-radius:var(--radius); padding:.8rem; margin-bottom:.9rem; font-size:.85rem;
}
.nutrient-table{width:100%; border-collapse:collapse; font-size:.88rem}
.nutrient-table td,.nutrient-table th{padding:.35rem .2rem; border-bottom:1px solid var(--border); text-align:left}
.nutrient-table th{color:var(--text-faint); font-weight:600}
ul.plain{list-style:none; margin:0; padding:0}
ul.plain li{padding:.3rem 0; font-size:.9rem}
.cautions li::before{content:"⚠ "; color:var(--warn)}
.benefits li::before{content:"✓ "; color:var(--ok)}
.diag-row{display:flex; align-items:center; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid var(--border)}
.diag-row:last-child{border-bottom:none}
.diag-row .name{font-weight:600}
.diag-detail{font-size:.8rem; color:var(--text-faint); margin-top:.2rem}
#toast-container{position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:.4rem; width:min(92vw,420px)}
.toast{background:var(--bg-elev); border:1px solid var(--border); color:var(--text); padding:.7rem .9rem; border-radius:var(--radius-sm); box-shadow:var(--shadow); font-size:.85rem}
.toast.error{border-color:var(--danger)}
.toast.success{border-color:var(--ok)}
.skeleton{background:linear-gradient(90deg,var(--bg-card),var(--border),var(--bg-card)); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:var(--radius-sm); height:1rem}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.footer-note{margin-top:2rem; font-size:.75rem; color:var(--text-faint); text-align:center; line-height:1.5}
.key-row{display:flex; align-items:center; gap:.5rem}
.key-row input{flex:1}
.toggle-row{display:flex; align-items:center; gap:.5rem; font-size:.85rem; color:var(--text-dim)}
.range-buttons{display:flex; gap:.4rem; flex-wrap:wrap}
.range-buttons button{flex:1}
.empty-state{text-align:center; padding:2.5rem 1rem; color:var(--text-faint)}
.empty-state .big{font-size:2.4rem; display:block; margin-bottom:.4rem}
.recipe-card{display:flex; gap:.7rem; align-items:center; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:.7rem; margin-bottom:.6rem}
.recipe-card img{width:64px; height:64px; border-radius:var(--radius-sm); object-fit:cover; flex:none; background:var(--border)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🥗</span><span>Food &amp; Nutrition AI</span></div>
    <span id="net-status" class="status-pill offline"><span class="dot"></span><span>—</span></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div id="toast-container"></div>
</div>

<script>
"use strict";

/* =========================================================================
   CONFIG
   ========================================================================= */
const CONFIG = {
  usda: { base: "https://api.nal.usda.gov/fdc/v1" },
  off:  { base: "https://world.openfoodfacts.org" },
  mealdb: { base: "https://www.themealdb.com/api/json/v1" },
  gemini: { base: "https://generativelanguage.googleapis.com/v1beta" },
  claude: { base: "https://api.anthropic.com/v1", version: "2023-06-01" },
  cacheDefaultDays: 7,
  maxCachedFoods: 100,
  maxCachedRecipes: 100,
  candidateLimit: 5,
};

const DEFAULT_MODELS = {
  // Fijo a una versión estable en vez del alias "-latest": ese alias se
  // reengancha a modelos nuevos sin aviso (p.ej. saltó a Gemini 3.7 Flash a
  // los pocos días de su lanzamiento el 13/08/2026, con capacidad de
  // servidor congestionada -- peticiones colgadas ~20s). "gemini-2.5-flash"
  // se probó primero pero Google ya lo retiró (confirmado por HTTP 404,
  // "no longer available"). Verificado en vivo el 28/08/2026 que este sí
  // responde: si vuelve a fallar, probar "gemini-3.5-flash-lite" (también
  // verificado ese día) antes que el alias "-latest".
  gemini: "gemini-3.6-flash",
  claude: "claude-sonnet-4-5",
};

/* =========================================================================
   UTILIDADES
   ========================================================================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const el = (tag, attrs, children) => {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") node.className = attrs[k];
    else if (k === "html") node.innerHTML = attrs[k];
    else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
};
const escapeHtml = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtNum(n, digits) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("es-ES", { maximumFractionDigits: digits != null ? digits : 1 });
}
function toast(msg, type) {
  const c = $("#toast-container");
  const t = el("div", { class: "toast" + (type ? " " + type : "") }, [msg]);
  c.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
async function withTimeout(promise, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try { return await promise(ctrl.signal); }
  finally { clearTimeout(timer); }
}

/* =========================================================================
   INDEXEDDB
   ========================================================================= */
const IDB = (() => {
  const DB_NAME = "food-pwa-db";
  const DB_VERSION = 1;
  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
        if (!db.objectStoreNames.contains("cache")) db.createObjectStore("cache", { keyPath: "cacheKey" });
        if (!db.objectStoreNames.contains("favorites")) db.createObjectStore("favorites", { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function tx(store, mode) {
    return open().then(db => db.transaction(store, mode).objectStore(store));
  }

  function reqToPromise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  return {
    async get(store, key) {
      try { const s = await tx(store, "readonly"); return await reqToPromise(s.get(key)); }
      catch (e) { console.warn("IDB get error", e); return undefined; }
    },
    async getAll(store) {
      try { const s = await tx(store, "readonly"); return await reqToPromise(s.getAll()); }
      catch (e) { console.warn("IDB getAll error", e); return []; }
    },
    async put(store, value) {
      try { const s = await tx(store, "readwrite"); return await reqToPromise(s.put(value)); }
      catch (e) { console.warn("IDB put error", e); return null; }
    },
    async delete(store, key) {
      try { const s = await tx(store, "readwrite"); return await reqToPromise(s.delete(key)); }
      catch (e) { console.warn("IDB delete error", e); return null; }
    },
    async clear(store) {
      try { const s = await tx(store, "readwrite"); return await reqToPromise(s.clear()); }
      catch (e) { console.warn("IDB clear error", e); return null; }
    },
    async available() {
      try { await open(); return true; } catch { return false; }
    },
  };
})();

/* =========================================================================
   CREDENCIALES (API keys) — IndexedDB si "recordar" está activo, si no
   sessionStorage (se borran al cerrar la pestaña/navegador).
   ========================================================================= */
const Credentials = (() => {
  const SESSION_KEY = "food-pwa-session-keys";

  function readSession() {
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || "{}"); }
    catch { return {}; }
  }
  function writeSession(obj) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch {}
  }

  return {
    async getRemember() {
      const s = await IDB.get("settings", "rememberKeys");
      return s ? !!s.value : false;
    },
    async setRemember(value) {
      const wasRemember = await this.getRemember();
      if (value && !wasRemember) {
        // al activar "recordar", las claves que hubiera en sessionStorage
        // deben migrarse a IndexedDB -- si no, quedan huérfanas: get()/getAll()
        // empiezan a mirar en IndexedDB (vacío) y la clave "desaparece" aunque
        // sigue en sessionStorage sin usarse.
        await IDB.put("settings", { key: "apiKeys", value: readSession() });
      }
      await IDB.put("settings", { key: "rememberKeys", value: !!value });
      if (!value) {
        // al desactivar, las claves guardadas en IndexedDB se eliminan
        await IDB.delete("settings", "apiKeys");
      }
    },
    async getAll() {
      const remember = await this.getRemember();
      if (remember) {
        const rec = await IDB.get("settings", "apiKeys");
        return (rec && rec.value) || {};
      }
      return readSession();
    },
    async set(provider, value) {
      const remember = await this.getRemember();
      const all = await this.getAll();
      all[provider] = value;
      if (remember) await IDB.put("settings", { key: "apiKeys", value: all });
      else writeSession(all);
    },
    async clearAll() {
      await IDB.delete("settings", "apiKeys");
      writeSession({});
    },
    async get(provider) {
      const all = await this.getAll();
      return all[provider] || "";
    },
  };
})();

/* =========================================================================
   AJUSTES GENERALES (modelos, cache, permitir IA de pago)
   ========================================================================= */
const Settings = {
  async get(key, fallback) {
    const rec = await IDB.get("settings", key);
    return rec ? rec.value : fallback;
  },
  async set(key, value) {
    await IDB.put("settings", { key, value });
  },
};

/* =========================================================================
   CACHE MANAGER (IndexedDB, con caducidad configurable)
   ========================================================================= */
const CacheManager = {
  async policy() {
    // 'off' | '7' | '30' | 'never'
    return await Settings.get("cachePolicy", "7");
  },
  async setPolicy(p) { await Settings.set("cachePolicy", p); },
  async get(key) {
    const policy = await this.policy();
    if (policy === "off") return null;
    const rec = await IDB.get("cache", key);
    if (!rec) return null;
    if (rec.expiresAt && Date.now() > rec.expiresAt) {
      await IDB.delete("cache", key);
      return null;
    }
    return rec.data;
  },
  async set(key, data) {
    const policy = await this.policy();
    if (policy === "off") return;
    let expiresAt = null;
    if (policy === "7") expiresAt = Date.now() + 7 * 86400000;
    else if (policy === "30") expiresAt = Date.now() + 30 * 86400000;
    await IDB.put("cache", { cacheKey: key, data, savedAt: Date.now(), expiresAt });
    this._trim();
  },
  async _trim() {
    const all = await IDB.getAll("cache");
    if (all.length > CONFIG.maxCachedFoods + CONFIG.maxCachedRecipes) {
      all.sort((a, b) => a.savedAt - b.savedAt);
      const toRemove = all.slice(0, all.length - (CONFIG.maxCachedFoods + CONFIG.maxCachedRecipes));
      for (const r of toRemove) await IDB.delete("cache", r.cacheKey);
    }
  },
  async clearAll() { await IDB.clear("cache"); },
};

/* =========================================================================
   FAVORITOS
   ========================================================================= */
const Favorites = {
  async list() { return (await IDB.getAll("favorites")).sort((a, b) => b.addedAt - a.addedAt); },
  async add(type, refId, name, snapshot) {
    const id = type + ":" + refId;
    await IDB.put("favorites", { id, type, refId, name, snapshot, addedAt: Date.now() });
  },
  async remove(id) { await IDB.delete("favorites", id); },
  async has(type, refId) {
    const rec = await IDB.get("favorites", type + ":" + refId);
    return !!rec;
  },
};

/* =========================================================================
   LIMITADOR DE PETICIONES (para respetar límites de Open Food Facts)
   ========================================================================= */
function makeRateLimiter(maxPerWindow, windowMs) {
  const hits = [];
  return {
    canGo() {
      const now = Date.now();
      while (hits.length && now - hits[0] > windowMs) hits.shift();
      return hits.length < maxPerWindow;
    },
    record() { hits.push(Date.now()); },
    waitMs() {
      if (this.canGo()) return 0;
      return windowMs - (Date.now() - hits[0]) + 50;
    },
  };
}
const offReadLimiter = makeRateLimiter(15, 60000);
const offSearchLimiter = makeRateLimiter(10, 60000);

/* =========================================================================
   HTTP helper
   ========================================================================= */
async function fetchJson(url, opts, timeoutMs) {
  try {
    const data = await withTimeout(async (signal) => {
      const res = await fetch(url, Object.assign({}, opts, { signal }));
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch { json = null; }
      return { ok: res.ok, status: res.status, data: json, raw: text };
    }, timeoutMs || 12000);
    return data;
  } catch (e) {
    const isAbort = e && e.name === "AbortError";
    return { ok: false, status: 0, data: null, error: isAbort ? "timeout" : ("red/CORS: " + (e && e.message || e)) };
  }
}

/* =========================================================================
   USDA FoodData Central
   ========================================================================= */
const USDA = {
  async search(query, pageSize) {
    const key = await Credentials.get("usda");
    if (!key) return { ok: false, error: "no-key" };
    const cacheKey = "usda:search:" + query.toLowerCase();
    const cached = await CacheManager.get(cacheKey);
    if (cached) return { ok: true, data: cached, cached: true };
    const url = CONFIG.usda.base + "/foods/search?api_key=" + encodeURIComponent(key) +
      "&query=" + encodeURIComponent(query) + "&pageSize=" + (pageSize || 8) +
      "&dataType=" + encodeURIComponent("Foundation,SR Legacy");
    const res = await fetchJson(url, { method: "GET" });
    if (res.ok && res.data) { await CacheManager.set(cacheKey, res.data); return { ok: true, data: res.data }; }
    return { ok: false, status: res.status, error: res.error || ("HTTP " + res.status) };
  },
  async details(fdcId) {
    const key = await Credentials.get("usda");
    if (!key) return { ok: false, error: "no-key" };
    const cacheKey = "usda:details:" + fdcId;
    const cached = await CacheManager.get(cacheKey);
    if (cached) return { ok: true, data: cached, cached: true };
    const url = CONFIG.usda.base + "/food/" + encodeURIComponent(fdcId) + "?api_key=" + encodeURIComponent(key);
    const res = await fetchJson(url, { method: "GET" });
    if (res.ok && res.data) { await CacheManager.set(cacheKey, res.data); return { ok: true, data: res.data }; }
    return { ok: false, status: res.status, error: res.error || ("HTTP " + res.status) };
  },
};

/* =========================================================================
   Open Food Facts
   Nota: los navegadores no permiten fijar un User-Agent personalizado desde
   fetch(); se envía el del propio navegador. No requiere API key.
   ========================================================================= */
const OFF = {
  async byBarcode(ean) {
    if (!offReadLimiter.canGo()) return { ok: false, error: "rate-limit", waitMs: offReadLimiter.waitMs() };
    const cacheKey = "off:barcode:" + ean;
    const cached = await CacheManager.get(cacheKey);
    if (cached) return { ok: true, data: cached, cached: true };
    offReadLimiter.record();
    const url = CONFIG.off.base + "/api/v2/product/" + encodeURIComponent(ean) +

/* =========================================================================
   AI ADAPTER — Gemini (predeterminado) y Claude (opcional, sin fallback
   automático). Ambos consultados directamente desde el navegador.
   ========================================================================= */
const AI = {
  async _model(provider) {
    return await Settings.get("model_" + provider, DEFAULT_MODELS[provider]);
  },
  // webSearch: deja que el propio modelo busque en la web en tiempo real
  // cuando lo necesite (p.ej. no puede leer una etiqueta o no reconoce el
  // producto) -- Gemini incluye 5.000 búsquedas gratis al mes en su tier
  // gratuito para modelos Gemini 3; en Claude cuesta aparte ($10/1000
  // búsquedas), así que solo se activa donde se pide explícitamente.
  // No es compatible de forma fiable con el modo JSON estricto en todos
  // los modelos, así que con webSearch se pide el JSON por prompt en vez
  // de por responseMimeType, y se interpreta con parseJsonLoose().
  async gemini(prompt, jsonMode, images, webSearch) {
    const key = await Credentials.get("gemini");
    if (!key) return { ok: false, error: "no-key" };
    const model = await this._model("gemini");
    const url = CONFIG.gemini.base + "/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(key);
    const parts = [{ text: prompt }];
    (images || []).forEach(img => parts.push({ inlineData: { mimeType: img.mimeType, data: img.data } }));
    const body = { contents: [{ parts }] };
    if (webSearch) body.tools = [{ google_search: {} }];
    else if (jsonMode) body.generationConfig = { responseMimeType: "application/json" };
    const res = await fetchJson(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    }, images && images.length ? 40000 : 20000);
    if (!res.ok) return { ok: false, status: res.status, error: res.error || ("HTTP " + res.status) };
    try {
      const text = res.data.candidates[0].content.parts.map(p => p.text || "").join("");
      return { ok: true, text, provider: "gemini" };
    } catch { return { ok: false, error: "respuesta inesperada de Gemini" }; }
  },
  async claude(prompt, jsonMode, images, webSearch) {
    const key = await Credentials.get("claude");
    if (!key) return { ok: false, error: "no-key" };
    const model = await this._model("claude");
    const url = CONFIG.claude.base + "/messages";
    const finalPrompt = (jsonMode && !webSearch) ? (prompt + "\n\nResponde ÚNICAMENTE con JSON válido, sin texto adicional ni bloques de código.") : prompt;
    let content = finalPrompt;
    if (images && images.length) {
      content = images.map(img => ({ type: "image", source: { type: "base64", media_type: img.mimeType, data: img.data } }));
      content.push({ type: "text", text: finalPrompt });
    }
    const body = { model, max_tokens: 1024, messages: [{ role: "user", content }] };
    if (webSearch) body.tools = [{ type: "web_search_20250305", name: "web_search", max_uses: 3 }];
    const res = await fetchJson(url, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": CONFIG.claude.version,
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify(body),
    }, (images && images.length) || webSearch ? 40000 : 20000);
    if (!res.ok) return { ok: false, status: res.status, error: res.error || ("HTTP " + res.status) };
    try {
      const text = res.data.content.map(c => c.text || "").join("");
      return { ok: true, text, provider: "claude" };
    } catch { return { ok: false, error: "respuesta inesperada de Claude" }; }
  },
  // Sin fallback automático con coste: si Gemini falla, se informa y se deja
  // que la vista decida si pide consentimiento para usar Claude.
  async ask(prompt, opts) {
    opts = opts || {};
    const provider = opts.provider || "gemini";
    const jsonMode = !!opts.json;
    const images = opts.images;
    const webSearch = !!opts.webSearch;
    const result = provider === "claude" ? await this.claude(prompt, jsonMode, images, webSearch) : await this.gemini(prompt, jsonMode, images, webSearch);
    return result;
  },
  parseJsonLoose(text) {
    if (!text) return null;
    let t = text.trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
    try { return JSON.parse(t); } catch {}
    const m = t.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch {} }
    return null;
  },
  // Una sola llamada para traducir varios títulos de receta de golpe
  async translateMealTitles(titles) {
    if (!titles.length) return {};
    const geminiKey = await Credentials.get("gemini");
    const provider = geminiKey ? "gemini" : (await Credentials.get("claude")) ? "claude" : null;
    if (!provider) return {};
    const prompt = "Traduce estos títulos de recetas de cocina al español de forma natural y breve. Devuelve " +
      "SOLO un JSON de la forma {\"título original\": \"traducción\", ...} con una entrada por cada título de " +
      "esta lista: " + JSON.stringify(titles);
    const res = await this.ask(prompt, { provider, json: true });
    if (!res.ok) return {};
    const parsed = this.parseJsonLoose(res.text);
    return (parsed && typeof parsed === "object") ? parsed : {};
  },
  // Una sola llamada para traducir varios nombres de golpe (en vez de una por candidato)
  async translateFoodNames(names) {
    if (!names.length) return {};
    const geminiKey = await Credentials.get("gemini");
    const provider = geminiKey ? "gemini" : (await Credentials.get("claude")) ? "claude" : null;
    if (!provider) return {};
    const prompt = "Traduce estos nombres de alimentos (en inglés, de USDA) a nombres naturales y breves en " +
      "español, sin anotaciones técnicas como ', raw' o ', cooked'. Devuelve SOLO un JSON de la forma " +
      "{\"nombre original\": \"traducción\", ...} con una entrada por cada nombre de esta lista: " + JSON.stringify(names);
    const res = await this.ask(prompt, { provider, json: true });
    if (!res.ok) return {};
    const parsed = this.parseJsonLoose(res.text);
    return (parsed && typeof parsed === "object") ? parsed : {};
  },
};

  rice: "arroz", banana: "plátano", almonds: "almendras", spinach: "espinacas",

};

const QueryInterpreter = {
  localInterpret(text) {
    const matched = SYMPTOM_MAP.filter(m => m.kws.some(re => re.test(text)));
    const chosen = matched.length ? matched : [{ id: "general_healthy", terms: ["fruit","vegetable","whole grain"], label: "alimentación general" }];
    const terms = [...new Set(chosen.flatMap(m => m.terms))];
    const termLabels = {};
    terms.forEach(t => { termLabels[t] = EN_ES_TERMS[t] || t; });
    return {
      source: "local",
      categories: chosen.map(m => m.label),
      searchTerms: terms,
      termLabels,
      language: "es",
    };
  },
  async interpret(text) {
    const geminiKey = await Credentials.get("gemini");
    if (geminiKey) {
      const prompt = "Eres un intérprete de consultas nutricionales. A partir del texto del usuario, " +
        "devuelve JSON con esta forma exacta: {\"categories\": [\"...\"], \"searchTerms\": [\"...\"], \"searchTermsEs\": [\"...\"]}. " +
        "\"searchTerms\" debe tener 3 a 6 nombres de alimentos genéricos EN INGLÉS (para buscar en bases de datos " +
        "nutricionales como USDA), relevantes para la consulta. \"searchTermsEs\" es la traducción al español de " +
        "cada elemento de \"searchTerms\", en el mismo orden y con el mismo número de elementos. No incluyas " +
        "explicación, solo el JSON.\n\nConsulta del usuario: " + JSON.stringify(text);
      const res = await AI.ask(prompt, { provider: "gemini", json: true });
      if (res.ok) {
        const parsed = AI.parseJsonLoose(res.text);
        if (parsed && Array.isArray(parsed.searchTerms) && parsed.searchTerms.length) {
          const searchTerms = parsed.searchTerms.slice(0, 6);
          const termLabels = {};
          searchTerms.forEach((t, i) => {
            termLabels[t] = (Array.isArray(parsed.searchTermsEs) && parsed.searchTermsEs[i]) || EN_ES_TERMS[t.toLowerCase()] || t;
          });
          return { source: "ai", categories: parsed.categories || [], searchTerms, termLabels, language: "es" };
        }
      }
      // IA disponible pero falló o devolvió algo inválido: cae a heurística local
      return Object.assign(this.localInterpret(text), { aiFailed: true });
    }
    return this.localInterpret(text);
  },
};

/* =========================================================================
   CANDIDATE ENGINE
   ========================================================================= */
const CandidateEngine = {
  async build(interpreted) {
    const seen = new Set();
    const candidates = [];
    for (const term of interpreted.searchTerms) {
      if (candidates.length >= CONFIG.candidateLimit) break;
      const res = await USDA.search(term, 3);
      if (!res.ok || !res.data || !Array.isArray(res.data.foods)) continue;
      for (const food of res.data.foods) {
        if (candidates.length >= CONFIG.candidateLimit) break;
        const key = (food.description || "").toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        candidates.push({
          fdcId: food.fdcId,
          name: food.description,
          matchedTerm: (interpreted.termLabels && interpreted.termLabels[term]) || term,
          dataType: food.dataType,
        });
      }
    }
    return candidates;
  },
};

const CAUTION_RULES = [
  { re: /milk|dairy|cheese|yogurt|yoghurt|cream/i, text: "Contiene o puede contener lácteos" },
  { re: /wheat|barley|rye|gluten/i, text: "Contiene o puede contener gluten" },
  { re: /peanut|almond|walnut|cashew|pistachio|hazelnut|nut/i, text: "Puede contener frutos secos" },
  { re: /shrimp|shellfish|crab|lobster/i, text: "Puede contener marisco" },
  { re: /egg/i, text: "Contiene o puede contener huevo" },
  { re: /soy/i, text: "Contiene o puede contener soja" },

const EvidenceEngine = {
  extractNutrients(details) {
    const out = {};
    const list = details.foodNutrients || [];
    const pick = (names) => {
      const n = list.find(x => names.some(nm => (x.nutrientName || (x.nutrient && x.nutrient.name) || "").toLowerCase().includes(nm)));
      if (!n) return null;
      return { value: n.value != null ? n.value : (n.amount != null ? n.amount : null), unit: n.unitName || (n.nutrient && n.nutrient.unitName) || "" };
    };
    out.calories = pick(["energy"]);
    out.protein = pick(["protein"]);
    out.carbs = pick(["carbohydrate, by difference", "carbohydrate"]);
    out.fat = pick(["total lipid", "fat"]);
    out.fiber = pick(["fiber"]);
    out.sugars = pick(["sugars"]);
    out.sodium = pick(["sodium"]);
    return out;
  },
  cautionsFor(name) {
    const found = [];
    for (const rule of CAUTION_RULES) if (rule.re.test(name)) found.push(rule.text);
    return found;
  },
  async enrich(candidate) {
    const res = await USDA.details(candidate.fdcId);
    if (!res.ok || !res.data) {
      return Object.assign({}, candidate, { dataQuality: "baja", nutrients: null, cautions: [], stars: 2 });
    }
    const nutrients = this.extractNutrients(res.data);
    const filled = Object.values(nutrients).filter(Boolean).length;
    const dataQuality = filled >= 5 ? "alta" : filled >= 2 ? "media" : "baja";
    const cautions = this.cautionsFor(candidate.name + " " + (res.data.ingredients || ""));
    const stars = Math.max(1, Math.min(5, 3 + (filled >= 5 ? 1 : 0) + (candidate.dataType === "Foundation" ? 1 : 0) - cautions.length));
    return Object.assign({}, candidate, { dataQuality, nutrients, cautions, stars, raw: res.data });
  },
};

/* =========================================================================
   MOTOR DE ANÁLISIS POR FOTO
   ========================================================================= */
// Redimensiona en el propio navegador antes de mandar la imagen a la IA:
// menos coste, subida más rápida, y evita fotos de móvil de varios MB.
function resizeImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo procesar la imagen"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Convierte los nutrientes de Open Food Facts (por 100g) al mismo formato
// {value, unit} que ya usa la tabla de nutrición del resto de la app.
function mapOffNutrients(nutriments) {
  if (!nutriments) return null;
  const g = (key) => (nutriments[key] != null ? { value: nutriments[key], unit: "g" } : null);
  const kcal = nutriments["energy-kcal_100g"] != null ? { value: nutriments["energy-kcal_100g"], unit: "kcal" } : null;
  const sodium = nutriments["sodium_100g"] != null ? { value: nutriments["sodium_100g"] * 1000, unit: "mg" } : null;
  return {
    calories: kcal, protein: g("proteins_100g"), carbs: g("carbohydrates_100g"),
    sugars: g("sugars_100g"), fat: g("fat_100g"), fiber: g("fiber_100g"), sodium,
  };
}

const NUTRISCORE_COLOR = { a: "var(--ok)", b: "#8bc34a", c: "var(--warn)", d: "#ff7043", e: "var(--danger)" };

// Valida el dígito de control de EAN-13/UPC-A -- sirve para detectar si la
// IA ha leído mal algún dígito del código de barras en la foto (error de
// OCR habitual en números pequeños), antes de darlo por bueno.
function isValidBarcode(code) {
  if (!/^\d{12,13}$/.test(code)) return false;
  const digits = code.length === 12 ? "0" + code : code; // UPC-A -> EAN-13
  const nums = digits.split("").map(Number);
  const checkDigit = nums.pop();
  let sum = 0;
  nums.forEach((d, i) => { sum += d * (i % 2 === 0 ? 1 : 3); });
  return (10 - (sum % 10)) % 10 === checkDigit;
}

// Decodifica el código de barras leyendo las barras de verdad (no los
// dígitos impresos), usando la API nativa del navegador si está disponible.
// No todos los navegadores la soportan (sobre todo en escritorio) -- si no
// está, se sigue dependiendo de que la IA lea los dígitos de la foto.
async function detectBarcodeFromDataUrl(dataUrl) {
  if (!("BarcodeDetector" in window)) return null;
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    const wanted = ["ean_13", "ean_8", "upc_a", "upc_e"].filter(f => formats.includes(f));
    if (!wanted.length) return null;
    const detector = new BarcodeDetector({ formats: wanted });
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = dataUrl; });
    const results = await detector.detect(img);
    if (results && results.length) return results[0].rawValue;
  } catch {}
  return null;
}

   ========================================================================= */
function pluralizeWord(w) {
  if (/[^aeiou]o$/i.test(w)) return w + "es";
  if (/[^aeiou]y$/i.test(w)) return w.slice(0, -1) + "ies";
  if (/(s|x|z|ch|sh)$/i.test(w)) return w + "es";
  return w + "s";
}
function singularizeWord(w) {
  if (/ies$/i.test(w)) return w.slice(0, -3) + "y";
  if (/oes$/i.test(w)) return w.slice(0, -2);
  if (/s$/i.test(w) && !/ss$/i.test(w)) return w.slice(0, -1);
  return w;
}
function phraseVariants(phrase) {
  const parts = phrase.split(" ");
  const last = parts[parts.length - 1];
  const withLast = w => [...parts.slice(0, -1), w].join(" ");
  return [phrase, withLast(pluralizeWord(last)), withLast(singularizeWord(last))];
}

  pasta: "pasta", harina: "flour", mantequilla: "butter",
};
async function translateIngredientTerm(term) {
  const key = term.trim().toLowerCase();
  if (ES_EN_INGREDIENTS[key]) return ES_EN_INGREDIENTS[key];
  const geminiKey = await Credentials.get("gemini");
  const provider = geminiKey ? "gemini" : (await Credentials.get("claude")) ? "claude" : null;
  if (!provider) return term;
  const prompt = "Traduce este ingrediente de cocina al inglés, en un máximo de 2 palabras, tal como aparecería " +
    "en una lista de ingredientes de recetas (ej. 'chicken breast', 'sweet potato'). Responde ÚNICAMENTE con la " +
    "traducción, sin comillas ni explicación: " + term;
  const res = await AI.ask(prompt, { provider, json: false });
  return res.ok ? res.text.trim().replace(/^["']|["']$/g, "") : term;
}

const RecipeEngine = {
  // TheMealDB solo acepta el nombre EXACTO de su lista fija de ingredientes
  // (p.ej. "Ginger", no "Ginger root"; "Sweet Potatoes", no "Sweet potato"),
  // así que hay que casar el nombre USDA contra esa lista en vez de adivinar.
  async forIngredient(name) {
    const cleaned = name.split(",")[0].split("(")[0].trim();
    const words = cleaned.split(/\s+/).filter(Boolean);
    const phrases = [cleaned, words.slice(0, 2).join(" "), words[0]].filter((v, i, a) => v && a.indexOf(v) === i);
    const candidates = new Set();
    phrases.forEach(p => phraseVariants(p).forEach(v => candidates.add(v)));

    const list = await MealDB.getIngredientList();
    const listByNorm = new Map(list.map(n => [n.toLowerCase(), n]));

    for (const cand of candidates) {
      const match = listByNorm.get(cand.toLowerCase());
      if (match) {
        const res = await MealDB.filterByIngredient(match);
        if (res.ok && res.data && Array.isArray(res.data.meals)) return res.data.meals.slice(0, 6);
        return [];
      }
    }
    return [];
  },
};

const Diagnostics = {
  CACHE_KEY: "food-pwa-diag-cache",
  getCached() {
    try { return JSON.parse(localStorage.getItem(this.CACHE_KEY) || "null"); }
    catch { return null; }
  },
  saveCache(results) {
    try { localStorage.setItem(this.CACHE_KEY, JSON.stringify({ results, at: Date.now() })); } catch {}
  },
  async run() {
    const results = [];
    results.push({ name: "PWA / Service Worker", ok: "serviceWorker" in navigator, detail: "serviceWorker" in navigator ? "Disponible" : "No soportado por este navegador" });
    const idbOk = await IDB.available();
    results.push({ name: "IndexedDB", ok: idbOk, detail: idbOk ? "Disponible" : "No se pudo abrir la base local" });
    results.push({ name: "Conexión a Internet", ok: navigator.onLine, detail: navigator.onLine ? "Conectado" : "Sin conexión" });

    const usdaKey = await Credentials.get("usda");
    if (usdaKey) {
      const r = await USDA.search("apple", 1);
      results.push({ name: "USDA FoodData Central", ok: r.ok, detail: r.ok ? "Conectado" : this._explain("usda", r) });
    } else {
      results.push({ name: "USDA FoodData Central", ok: null, detail: "Clave no configurada" });
    }

    const offR = await OFF.byBarcode("3017620422003");
    results.push({ name: "Open Food Facts", ok: offR.ok, detail: offR.ok ? "Conectado" : this._explain("off", offR) });

    const mealR = await MealDB.searchByName("chicken");
    results.push({ name: "TheMealDB", ok: mealR.ok, detail: mealR.ok ? "Conectado" : this._explain("mealdb", mealR) });

    const geminiKey = await Credentials.get("gemini");
    if (geminiKey) {
      const r = await AI.gemini("Responde solo con la palabra: ok", false);
      results.push({ name: "Gemini", ok: r.ok, detail: r.ok ? "Conectado" : this._explain("gemini", r) });
    } else {
      results.push({ name: "Gemini", ok: null, detail: "No configurada (opcional pero recomendada)" });
    }

    const claudeKey = await Credentials.get("claude");
    if (claudeKey) {
      const r = await AI.claude("Responde solo con la palabra: ok", false);
      results.push({ name: "Claude", ok: r.ok, detail: r.ok ? "Conectado" : this._explain("claude", r) });
    } else {
      results.push({ name: "Claude", ok: null, detail: "No configurada (opcional)" });
    }
    return results;
  },
  _explain(provider, r) {
    if (r.error === "no-key") return "Clave no configurada";
    if (r.status === 401 || r.status === 403) return "Clave inválida o sin permisos (HTTP " + r.status + ")";
    if (r.status === 429) return "Límite de peticiones alcanzado (HTTP 429)";
    if (r.error === "timeout") return "Tiempo de espera agotado (la petición tardó demasiado en responder, no llegó a rechazarse)";
    if (r.status === 0) return "Error de red o bloqueado por CORS";
    if (r.status) return "Error HTTP " + r.status;
    return r.error || "Error desconocido";
  },
};

function renderStatusChip(card) {
  const cached = Diagnostics.getCached();
  card.innerHTML = "";
  const row = el("div", { class: "row", style: "align-items:center; justify-content:space-between" }, []);
  if (!cached) {
    row.appendChild(el("span", {}, ["Estado del sistema"]));
    row.appendChild(el("span", { class: "chip warn" }, ["Sin comprobar"]));
  } else {
    const allReady = cached.results.filter(d => d.ok === false).length === 0;
    const ageMin = Math.round((Date.now() - cached.at) / 60000);
    const ageLabel = ageMin < 1 ? "hace un momento" : ageMin < 60 ? `hace ${ageMin} min` : `hace ${Math.round(ageMin / 60)} h`;
    row.appendChild(el("span", {}, [`Estado del sistema (${ageLabel})`]));
    row.appendChild(el("span", { class: "chip " + (allReady ? "ok" : "warn") }, [allReady ? "Listo" : "Revisar en Diagnóstico"]));
  }
  card.appendChild(row);
  const checkBtn = el("button", { class: "btn secondary small", style: "margin-top:.6rem" }, ["Comprobar ahora"]);
  checkBtn.addEventListener("click", async () => {
    checkBtn.disabled = true;
    checkBtn.textContent = "Comprobando…";
    const results = await Diagnostics.run().catch(() => []);
    Diagnostics.saveCache(results);
    renderStatusChip(card);
  });
  card.appendChild(checkBtn);
}

        "\"no recomendado\", \"puntuacion\": num del 1 al 5, \"explicacion\": \"...\"}, \"beneficiosYContras\": " +

        "completo del producto identificado (marca + variante). \"codigoBarras\" es el número de código de barras SOLO " +
        "si aparece legible en alguna foto, si no null. \"fuenteDatos\" indica de dónde salen los valores de " +
        "\"datosEtiqueta\": \"etiqueta\" si los leíste directamente de la foto, \"internet\" si los buscaste en la web, " +
        "\"desconocida\" si \"datosEtiqueta\" es null porque no pudiste conseguirlos de ninguna forma. \"datosEtiqueta\" " +
        "son los valores reales (leídos o encontrados), NO inventados -- usa null en un campo concreto si no lo " +
        "encuentras, y \"datosEtiqueta\" completo como null solo si no consigues ningún dato nutricional real por " +
        "ningún medio. \"valoracion\" es tu evaluación general de qué tan saludable es este producto, a modo de " +
        "Nutri-Score simplificado; \"puntuacion\" es esa misma valoración en una escala numérica de 1 (nada " +
        "recomendable) a 5 (muy saludable), coherente con \"nivel\". \"beneficiosYContras\", en español y en varias frases, explica de forma clara y " +
        "neutra qué aporta este producto y qué precauciones puede conllevar su consumo (por ejemplo síntomas " +
        "digestivos habituales asociados a su composición, o para qué perfiles no es recomendable por su cantidad de " +
        "azúcar/sodio/grasas), en tono informativo, sin diagnosticar ni prescribir, sin afirmar que cura o trata nada.";

      const res = await AI.ask(prompt, { provider, images, webSearch: true });
      if (res.ok) {
        const parsed = AI.parseJsonLoose(res.text);
        if (!parsed || !parsed.producto) {
          resultsWrap.innerHTML = "";
          resultsWrap.appendChild(el("div", { class: "card" }, ["No se pudo interpretar el resultado. Prueba con fotos más claras o con la etiqueta nutricional visible."]));
          resultsWrap.appendChild(buildBarcodePrompt("¿Se veía un código de barras en la foto? Puedo buscarlo directamente.", (product) => {
            const synthetic = { producto: product.product_name || "Producto", datosEtiqueta: null, valoracion: null, beneficiosYContras: "" };
            renderResult(synthetic, mapOffNutrients(product.nutriments), product.nutriscore_grade || null, product.product_name || null, null);
          }));
        } else {
          await resolveAndRender(parsed, detectedBarcode);
        }
      } else if (res.error === "no-key") {
        resultsWrap.innerHTML = "";
        resultsWrap.appendChild(el("div", { class: "card" }, [
          "Configura Gemini o Claude en Configuración para analizar fotos. ",
          el("a", { href: "#/config" }, ["Ir a Configuración →"]),
        ]));
      } else {
        resultsWrap.innerHTML = "";
        const msgCard = el("div", { class: "card" }, [
          (provider === "gemini" ? "Gemini" : "Claude") + " no disponible" + (res.error ? " (" + res.error + ")" : "") + ".",
        ]);
        resultsWrap.appendChild(msgCard);
        const claudeKey = provider === "gemini" ? await Credentials.get("claude") : null;
        if (claudeKey) {
          const retryBtn = el("button", { class: "btn secondary small", style: "margin-top:.4rem" }, ["Analizar con Claude en su lugar"]);
          retryBtn.addEventListener("click", () => runAnalysis("claude"));
          msgCard.appendChild(retryBtn);
        }
      }
      analyzeBtn.disabled = false; analyzeBtn.textContent = "Analizar";
    }

    async function resolveAndRender(parsed, detectedBarcode) {
      let realNutrients = null, nutriscoreGrade = null, realProductName = null, barcodeWarning = null;
      // Un código decodificado de verdad de las barras (no leído por la IA)
      // es fiable por construcción -- manda sobre lo que haya dicho la IA.
      if (detectedBarcode) {
        const offRes = await OFF.byBarcode(detectedBarcode);
        if (offRes.ok && offRes.data && offRes.data.product) {
          realNutrients = mapOffNutrients(offRes.data.product.nutriments);
          nutriscoreGrade = offRes.data.product.nutriscore_grade || null;
          realProductName = offRes.data.product.product_name || null;
        }
        renderResult(parsed, realNutrients, nutriscoreGrade, realProductName, null);
        return;
      }
      const aiBarcode = parsed.codigoBarras ? String(parsed.codigoBarras).replace(/[^0-9]/g, "") : "";
      if (aiBarcode && !isValidBarcode(aiBarcode)) {
        // Los dígitos pequeños de una foto se prestan a errores de OCR; si
        // no supera el dígito de control, casi seguro está mal leído -- no
        // merece la pena ni buscarlo en Open Food Facts.
        barcodeWarning = "No he podido leer con fiabilidad el código de barras de la foto (probablemente algún dígito " +
          "mal leído).";
      } else if (aiBarcode) {
        const offRes = await OFF.byBarcode(aiBarcode);
        if (offRes.ok && offRes.data && offRes.data.product) {
          realNutrients = mapOffNutrients(offRes.data.product.nutriments);
          nutriscoreGrade = offRes.data.product.nutriscore_grade || null;
          realProductName = offRes.data.product.product_name || null;
        }
      }
      // Sin código de barras válido (o sin match): la propia IA ya ha
      // buscado en internet los datos reales si hacía falta (webSearch en
      // la llamada), así que no hace falta una segunda búsqueda en OFF.
      renderResult(parsed, realNutrients, nutriscoreGrade, realProductName, barcodeWarning);
    }

    function renderResult(parsed, realNutrients, nutriscoreGrade, realProductName, barcodeWarning) {
      resultsWrap.innerHTML = "";
      resultsWrap.appendChild(el("h2", {}, ["🏷️ " + (realProductName || parsed.producto)]));

      if (barcodeWarning) {
        resultsWrap.appendChild(buildBarcodePrompt(barcodeWarning, (product) => {
          renderResult(parsed, mapOffNutrients(product.nutriments), product.nutriscore_grade || null, product.product_name || null, null);
        }));
      }

      if (nutriscoreGrade && NUTRISCORE_COLOR[nutriscoreGrade]) {
        resultsWrap.appendChild(el("div", { class: "row", style: "align-items:center; gap:.5rem; margin-bottom:.6rem" }, [
          el("span", { class: "chip", style: "background:" + (NUTRISCORE_COLOR[nutriscoreGrade] || "var(--text-faint)") + ";color:#fff" }, ["Nutri-Score " + nutriscoreGrade.toUpperCase()]),
          el("span", { class: "muted", style: "font-size:.8rem" }, ["dato real de Open Food Facts (código de barras)"]),
        ]));
      } else if (parsed.valoracion) {
        const nivelClass = { saludable: "ok", moderado: "warn", "no recomendado": "danger" }[parsed.valoracion.nivel] || "";
        const stars = Math.max(1, Math.min(5, Number(parsed.valoracion.puntuacion) || 3));
        resultsWrap.appendChild(el("div", { class: "row", style: "align-items:center; gap:.5rem; margin-bottom:.6rem; flex-wrap:wrap" }, [
          el("span", { class: "stars" }, ["★".repeat(stars) + "☆".repeat(5 - stars)]),
          el("span", { class: "chip " + nivelClass }, [parsed.valoracion.nivel || "desconocido"]),
          el("span", { class: "muted", style: "font-size:.8rem" }, ["estimación orientativa de la IA, no es una fuente oficial"]),
        ]));
      }

      const et = parsed.datosEtiqueta;
      const nutrients = realNutrients || (et ? {
        calories: et.calorias != null ? { value: et.calorias, unit: "kcal" } : null,
        protein: et.proteinas != null ? { value: et.proteinas, unit: "g" } : null,
        carbs: et.carbohidratos != null ? { value: et.carbohidratos, unit: "g" } : null,
        sugars: et.azucares != null ? { value: et.azucares, unit: "g" } : null,
        fat: et.grasas != null ? { value: et.grasas, unit: "g" } : null,
        fiber: et.fibra != null ? { value: et.fibra, unit: "g" } : null,
        sodium: et.sodio != null ? { value: et.sodio, unit: "mg" } : null,
      } : null);

      if (nutrients) {
        let sourceLabel;
        if (realNutrients) {
          sourceLabel = "Datos reales de Open Food Facts (código de barras exacto; por 100g).";
        } else if (parsed.fuenteDatos === "internet") {
          sourceLabel = "Buscado por IA en internet -- puede no ser exactamente tu envase, verifica en el producto si es importante.";
        } else {
          sourceLabel = "Leído por IA de la etiqueta en la foto" + (et && et.porcion ? " (" + et.porcion + ")" : "") + " -- no verificado en una base de datos.";
        }
        resultsWrap.appendChild(el("p", { class: "muted", style: "font-size:.8rem" }, [sourceLabel]));
        const rows = [
          ["Calorías", nutrients.calories], ["Proteínas", nutrients.protein], ["Carbohidratos", nutrients.carbs],
          ["Azúcares", nutrients.sugars], ["Grasas", nutrients.fat], ["Fibra", nutrients.fiber], ["Sodio", nutrients.sodium],
        ];
        const table = el("table", { class: "nutrient-table" }, []);
        table.appendChild(el("tr", {}, [el("th", {}, ["Nutriente"]), el("th", {}, ["Valor"])]));
        rows.forEach(([label, v]) => {
          table.appendChild(el("tr", {}, [el("td", {}, [label]), el("td", {}, [v ? fmtNum(v.value) + " " + v.unit : "—"])]));
        });
        resultsWrap.appendChild(el("div", { class: "card" }, [table]));
      } else {
        resultsWrap.appendChild(el("div", { class: "card" }, ["No se pudo leer ni encontrar información nutricional para este producto."]));
      }

      if (parsed.valoracion && parsed.valoracion.explicacion) {
        resultsWrap.appendChild(el("div", { class: "card" }, [el("p", {}, [parsed.valoracion.explicacion])]));
      }

      resultsWrap.appendChild(el("h2", {}, ["Beneficios y contras"]));
      resultsWrap.appendChild(el("div", { class: "card" }, [el("p", {}, [parsed.beneficiosYContras || "Sin información disponible."])]));

      resultsWrap.appendChild(el("div", { class: "info-banner" }, [
        "Esta información no constituye diagnóstico ni tratamiento médico. Es orientación nutricional general.",
      ]));
    }
  },

  async alimento(root, fdcId) {
    if (!fdcId) { root.appendChild(el("div", { class: "card" }, ["Alimento no especificado."])); return; }
    root.appendChild(el("div", { class: "skeleton", style: "width:40%; height:1.6rem; margin-bottom:1rem" }, []));

    let candidate = state.lastCandidates.find(c => String(c.fdcId) === String(fdcId));
    if (!candidate) candidate = { fdcId, name: "Alimento", matchedTerm: "" };
    let enriched = state.lastEnriched[fdcId];
    if (!enriched) {
      enriched = await EvidenceEngine.enrich(candidate);
      state.lastEnriched[fdcId] = enriched;
    }

    root.innerHTML = "";
    const titleEl = el("h1", {}, ["🥝 " + enriched.name]);
    root.appendChild(titleEl);
    root.appendChild(el("div", { class: "row", style: "margin-bottom:.8rem" }, [
      el("span", { class: "stars" }, ["★".repeat(enriched.stars) + "☆".repeat(5 - enriched.stars)]),
      el("span", { class: "chip " + (enriched.dataQuality === "alta" ? "ok" : enriched.dataQuality === "media" ? "warn" : "danger") }, ["Calidad de datos: " + enriched.dataQuality]),
    ]));

    const favBtn = el("button", { class: "btn secondary small" }, ["❤️ Guardar en favoritos"]);
    favBtn.addEventListener("click", async () => {
      await Favorites.add("food", enriched.fdcId, enriched.name, enriched);
      toast("Añadido a favoritos", "success");
    });
    root.appendChild(favBtn);

    root.appendChild(el("h2", {}, ["Nutrición"]));
    if (enriched.nutrients) {
      const rows = [
        ["Calorías", enriched.nutrients.calories],
        ["Proteínas", enriched.nutrients.protein],
        ["Carbohidratos", enriched.nutrients.carbs],
        ["Fibra", enriched.nutrients.fiber],
        ["Azúcares", enriched.nutrients.sugars],
        ["Grasas", enriched.nutrients.fat],
        ["Sodio", enriched.nutrients.sodium],
      ];
      const table = el("table", { class: "nutrient-table" }, []);
      table.appendChild(el("tr", {}, [el("th", {}, ["Nutriente"]), el("th", {}, ["Valor"])]));
      rows.forEach(([label, v]) => {
        table.appendChild(el("tr", {}, [
          el("td", {}, [label]),
          el("td", {}, [v ? fmtNum(v.value) + " " + v.unit : "—"]),
        ]));
      });
      root.appendChild(el("div", { class: "card" }, [table]));
    } else {
      root.appendChild(el("div", { class: "card" }, ["No hay datos nutricionales detallados disponibles para este alimento."]));
    }

    if (enriched.cautions && enriched.cautions.length) {
      root.appendChild(el("h2", {}, ["Precauciones"]));
      root.appendChild(el("div", { class: "card" }, [
        el("ul", { class: "plain cautions" }, enriched.cautions.map(c => el("li", {}, [c]))),
      ]));
    }

    root.appendChild(el("h2", {}, ["Explicación"]));
    const explainCard = el("div", { class: "card" }, ["Generando explicación…"]);
    root.appendChild(explainCard);

    root.appendChild(el("h2", {}, ["Recetas relacionadas"]));
    const recipesWrap = el("div", { class: "card" }, ["Cargando recetas…"]);
    root.appendChild(recipesWrap);

    // La explicación del alimento y la traducción de los títulos de receta se
    // piden en UNA sola llamada (en vez de dos) para gastar menos cupo de IA:
    // se espera a tener las recetas (sin IA, TheMealDB) antes de construir el
    // prompt, y se incluyen sus títulos junto a los datos nutricionales.
    (async () => {
      const meals = await RecipeEngine.forIngredient(enriched.name);
      recipesWrap.innerHTML = "";
      let titleEls = [];
      if (!meals.length) {
        recipesWrap.textContent = "Sin recetas encontradas en TheMealDB para este ingrediente.";
      } else {
        titleEls = renderRecipeCards(recipesWrap, meals, false);
      }

      if (enriched.aiExplanation) {
        renderExplanation(enriched.aiExplanation);
        if (meals.length) {
          AI.translateMealTitles(meals.map(m => m.strMeal)).then(map => {
            meals.forEach((m, i) => { if (map[m.strMeal]) titleEls[i].textContent = map[m.strMeal]; });
          }).catch(() => {});
        }
        return;
      }

      const dataSummary = JSON.stringify(enriched.nutrients);
      const mealTitles = meals.map(m => m.strMeal);
      const prompt = "Estos son datos nutricionales reales de \"" + enriched.name + "\" (USDA): " + dataSummary + ". " +
        (mealTitles.length ? "Estos son títulos de recetas de cocina relacionadas (en inglés): " + JSON.stringify(mealTitles) + ". " : "") +
        "Devuelve SOLO un JSON con esta forma exacta, sin texto fuera del JSON: " +
        "{\"nombreEs\": \"...\", \"explicacion\": \"...\"" + (mealTitles.length ? ", \"recetasEs\": {\"título original\": \"traducción\", ...}" : "") + "}. " +
        "\"nombreEs\" es el nombre de este alimento traducido de forma natural al español (breve, sin las anotaciones " +
        "técnicas de USDA como \", raw\" o \", cooked\"). \"explicacion\" es, en español y en máximo 4 frases, una " +
        "explicación clara y neutra de qué aporta este alimento, usando frases como 'aparece como candidato " +
        "potencialmente compatible', sin afirmar que cura o trata nada." +
        (mealTitles.length ? " \"recetasEs\" traduce al español cada título de receta de la lista anterior, uno por cada." : "");

      runExplanation("gemini");

      async function runExplanation(provider) {
        const res = await AI.ask(prompt, { provider, json: true });
        if (res.ok) {
          const parsed = AI.parseJsonLoose(res.text) || {};
          const result = { nombreEs: parsed.nombreEs || null, explicacion: parsed.explicacion || res.text, provider };
          enriched.aiExplanation = result;
          renderExplanation(result);
          if (parsed.recetasEs && typeof parsed.recetasEs === "object") {
            meals.forEach((m, i) => { if (parsed.recetasEs[m.strMeal]) titleEls[i].textContent = parsed.recetasEs[m.strMeal]; });
          }
        } else if (res.error === "no-key") {
          explainCard.innerHTML = "";
          explainCard.appendChild(el("p", { class: "muted" }, ["Configura Gemini en Configuración para ver aquí una explicación generada por IA."]));
        } else {
          explainCard.innerHTML = "";
          explainCard.appendChild(el("p", { class: "muted" }, ["Gemini no disponible" + (res.error ? " (" + res.error + ")" : "") + "."]));
          const claudeKey = provider === "gemini" ? await Credentials.get("claude") : null;
          if (claudeKey) {
            const retryBtn = el("button", { class: "btn secondary small", style: "margin-top:.4rem" }, ["Generar con Claude en su lugar"]);
            retryBtn.addEventListener("click", async () => {
              retryBtn.disabled = true; retryBtn.textContent = "Generando…";
              await runExplanation("claude");
            });
            explainCard.appendChild(retryBtn);
          }
        }
      }

      function renderExplanation(result) {
        explainCard.innerHTML = "";
        explainCard.appendChild(el("p", { style: "color:var(--text)" }, [result.explicacion]));
        if (result.nombreEs) titleEl.textContent = "🥝 " + result.nombreEs;
      }
    })();

    root.appendChild(el("h2", {}, ["Fuentes"]));
    root.appendChild(el("p", { class: "muted" }, ["USDA FoodData Central" + (enriched.cautions ? " · Open Food Facts (reglas de alérgenos) · TheMealDB · IA: Gemini" : "")]));
  },

    const cacheCard = el("div", { class: "card" }, [el("h3", { style: "margin-top:0" }, ["Caché"])]);
    const currentPolicy = await CacheManager.policy();
    const rangeWrap = el("div", { class: "range-buttons" }, []);
    [["off", "Desactivada"], ["7", "7 días"], ["30", "30 días"], ["never", "Sin caducidad"]].forEach(([val, label]) => {
      const b = el("button", { class: "btn " + (val === currentPolicy ? "" : "secondary") + " small" }, [label]);
      b.addEventListener("click", async () => { await CacheManager.setPolicy(val); renderRoute(); });
      rangeWrap.appendChild(b);
    });
    cacheCard.appendChild(rangeWrap);
    const clearCacheBtn = el("button", { class: "btn secondary small", style: "margin-top:.6rem" }, ["Vaciar caché ahora"]);
    clearCacheBtn.addEventListener("click", async () => { await CacheManager.clearAll(); toast("Caché vaciada", "success"); });
    cacheCard.appendChild(clearCacheBtn);
    root.appendChild(cacheCard);
  },

  async diagnostico(root) {
    root.appendChild(el("h1", {}, ["🧪 Diagnóstico"]));
    const card = el("div", { class: "card" }, []);
    root.appendChild(card);
    const summary = el("div", { class: "card tight" }, []);
    root.appendChild(summary);
    const rerun = el("button", { class: "btn secondary small", style: "margin-top:.8rem" }, ["Ejecutar diagnóstico"]);
    root.appendChild(rerun);

    function renderResults(results, ageLabel) {
      card.innerHTML = "";
      results.forEach(r => {
        const dotColor = r.ok === true ? "var(--ok)" : r.ok === false ? "var(--danger)" : "var(--text-faint)";
        const row = el("div", { class: "diag-row" }, [
          el("div", {}, [
            el("div", { class: "name" }, [r.name]),
            el("div", { class: "diag-detail" }, [r.detail]),
          ]),
          el("span", { class: "badge-dot", style: "background:" + dotColor }, []),
        ]);
        card.appendChild(row);
      });
      const allOk = results.every(r => r.ok !== false);
      summary.innerHTML = "";
      summary.appendChild(el("strong", {}, ["SISTEMA: "]));
      summary.appendChild(document.createTextNode((allOk ? "READY" : "REVISAR ELEMENTOS EN ROJO") + (ageLabel ? " (" + ageLabel + ")" : "")));
    }

    const cached = Diagnostics.getCached();
    if (cached) {
      const ageMin = Math.round((Date.now() - cached.at) / 60000);
      const ageLabel = ageMin < 1 ? "hace un momento" : ageMin < 60 ? `hace ${ageMin} min` : `hace ${Math.round(ageMin / 60)} h`;
      renderResults(cached.results, ageLabel);
    } else {
      card.textContent = "Sin comprobar todavía. Pulsa \"Ejecutar diagnóstico\" para comprobar las conexiones (esto consume peticiones a las APIs configuradas).";
    }

    rerun.addEventListener("click", async () => {
      rerun.disabled = true; rerun.textContent = "Comprobando…";
      card.innerHTML = "Ejecutando comprobaciones…";
      const results = await Diagnostics.run();
      Diagnostics.saveCache(results);
      renderResults(results);
      rerun.disabled = false; rerun.textContent = "Ejecutar diagnóstico";
    });
  },
};

/* =========================================================================
   MODAL DE RECETA
   ========================================================================= */
async function showRecipeModal(id) {
  const res = await MealDB.lookup(id);
  if (!res.ok || !res.data || !res.data.meals || !res.data.meals[0]) { toast("No se pudo cargar la receta"); return; }
  const meal = res.data.meals[0];
  const overlay = el("div", {
    style: "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center",
  }, []);
  const ingredients = [];
  for (let i = 1; i <= 20; i++) {
    const ing = meal["strIngredient" + i];
    const measure = meal["strMeasure" + i];
    if (ing && ing.trim()) ingredients.push((measure ? measure.trim() + " " : "") + ing.trim());
  }
  const titleEl = el("h2", { style: "margin-top:0" }, [meal.strMeal]);
  const ingredientsList = el("ul", { class: "plain" }, ingredients.map(i => el("li", {}, [i])));
  const instructionsEl = el("p", {}, [meal.strInstructions]);
  const translateStatus = el("p", { class: "muted" }, ["Traduciendo receta al español…"]);
  const panel = el("div", {
    class: "card", style: "max-width:640px;width:100%;max-height:85vh;overflow:auto;margin:0;border-radius:16px 16px 0 0",
  }, [
    titleEl,
    el("img", { src: meal.strMealThumb, alt: "", style: "width:100%;border-radius:var(--radius);margin-bottom:.6rem" }, []),
    translateStatus,
    el("h3", {}, ["Ingredientes"]),
    ingredientsList,
    el("h3", {}, ["Instrucciones"]),
    instructionsEl,
    el("button", { class: "btn full" }, ["Cerrar"]),
  ]);
  panel.querySelector("button:last-child").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  const prompt = "Traduce esta receta al español de forma natural y clara, sin inventar ni omitir ingredientes o " +
    "pasos. Devuelve SOLO un JSON con esta forma exacta: {\"titulo\": \"...\", \"ingredientes\": [array de " +
    "strings, mismo número y orden que la lista original], \"instrucciones\": \"...\"}. " +
    "Título original: " + JSON.stringify(meal.strMeal) + ". Ingredientes originales en orden: " +
    JSON.stringify(ingredients) + ". Instrucciones originales: " + JSON.stringify(meal.strInstructions);

  async function runTranslation(provider) {
    const res2 = await AI.ask(prompt, { provider, json: true });
    if (res2.ok) {
      const parsed = AI.parseJsonLoose(res2.text);
      if (parsed && parsed.titulo) {
        titleEl.textContent = parsed.titulo;
        if (Array.isArray(parsed.ingredientes) && parsed.ingredientes.length === ingredients.length) {
          [...ingredientsList.children].forEach((li, i) => { li.textContent = parsed.ingredientes[i]; });
        }
        if (parsed.instrucciones) instructionsEl.textContent = parsed.instrucciones;
        translateStatus.remove();
        return;
      }
    }
    translateStatus.innerHTML = "";
    translateStatus.appendChild(el("span", {}, ["No se pudo traducir la receta" + (res2.error ? " (" + res2.error + ")" : "") + "."]));
    const claudeKey = provider === "gemini" ? await Credentials.get("claude") : null;
    if (claudeKey) {
      const retryBtn = el("button", { class: "btn secondary small", style: "margin-left:.5rem" }, ["Traducir con Claude"]);
      retryBtn.addEventListener("click", async () => {
        retryBtn.disabled = true; retryBtn.textContent = "Traduciendo…";
        await runTranslation("claude");
      });
      translateStatus.appendChild(retryBtn);
    }
  }

  const geminiKey = await Credentials.get("gemini");
  if (geminiKey) runTranslation("gemini");
  else translateStatus.remove();
}

/* =========================================================================
   ESTADO DE RED
   ========================================================================= */
function updateNetStatus() {
  const pill = $("#net-status");
  const online = navigator.onLine;
  pill.className = "status-pill " + (online ? "online" : "offline");
  pill.querySelector("span:last-child").textContent = online ? "ONLINE" : "OFFLINE — datos almacenados";
}
window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);

/* =========================================================================
   ARRANQUE
   ========================================================================= */
window.addEventListener("hashchange", renderRoute);
window.addEventListener("DOMContentLoaded", async () => {
  updateNetStatus();
  await renderRoute();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed", err));
  }
});
</script>
